name: Next.js build (migration check)

# Builds the Next.js app and keeps the static output as a downloadable artifact.
# It does NOT deploy: the live site is still published by deploy.yml (Vite).
#
# Cutover (milestone M12): in deploy.yml change the build command to
# `npm run next:build` and the Pages artifact path from ./dist to ./out, then
# delete this workflow.

on:
  push:
    branches: ['84-migrate-to-nextjs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run next:build
      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: next-out
          path: ./out
          retention-days: 7
